<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>Mailtrack</h1>

    <div class="status" id="status">
      <span class="status-dot"></span>
      <span class="status-text">Checking...</span>
    </div>

    <div class="section">
      <label for="apiKey">API Key</label>
      <input type="password" id="apiKey" placeholder="Enter your API key">
    </div>

    <div class="section">
      <label class="toggle">
        <input type="checkbox" id="enabled" checked>
        <span class="slider"></span>
        <span class="label">Enable Mailtrack</span>
      </label>
    </div>

    <div class="section">
      <label class="toggle">
        <input type="checkbox" id="showNotification" checked>
        <span class="slider"></span>
        <span class="label">Show notifications for email opens</span>
      </label>
    </div>

    <div class="section">
      <div class="activity-card">
        <div class="activity-row">
          <span class="activity-label">Polling</span>
          <span class="activity-value" id="openPollStatus">Checking...</span>
        </div>
        <div class="activity-row">
          <span class="activity-label">Last poll</span>
          <span class="activity-value" id="lastOpenPollAt">Never</span>
        </div>
        <div class="activity-row">
          <span class="activity-label">New opens</span>
          <span class="activity-value" id="lastOpenPollNewCount">0</span>
        </div>
        <div class="activity-row">
          <span class="activity-label">Recent open</span>
          <span class="activity-value activity-wrap" id="lastOpenSummary">No recent opens</span>
        </div>
        <div class="activity-row" id="lastOpenPollErrorRow" hidden>
          <span class="activity-label">Last error</span>
          <span class="activity-value activity-wrap activity-error" id="lastOpenPollError">None</span>
        </div>
      </div>
    </div>

    <button id="saveBtn" class="btn-primary">Save Settings</button>

    <div class="footer">
      <a href="https://mailtrack.tachyonfuture.com" target="_blank">Open Dashboard</a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
